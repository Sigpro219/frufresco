<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 110" width="100%" height="100%">
  <!-- Icono Colsubsidio: Cuadrado azul redondeado con las franjas/arcos icónicos -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="90" height="90" rx="18" fill="#004A97" />
    <!-- Franjas onduladas características de Colsubsidio (rojo, blanco, azul claro) -->
    <path d="M 12 68 C 30 68, 45 45, 78 28 C 74 22, 65 18, 55 18 C 35 32, 22 52, 12 68 Z" fill="#E31B23" />
    <path d="M 18 78 C 35 78, 52 56, 82 42 C 80 36, 75 32, 70 30 C 45 45, 30 65, 18 78 Z" fill="#FFFFFF" opacity="0.95" />
    <path d="M 28 82 C 45 82, 60 68, 86 56 C 85 50, 82 46, 78 44 C 55 60, 42 74, 28 82 Z" fill="#00A3E0" />
  </g>
  <!-- Texto Colsubsidio tipográfico institucional -->
  <g transform="translate(115, 62)">
    <text font-family="'Inter', 'Arial', sans-serif" font-size="44" font-weight="900" fill="#004A97" letter-spacing="-0.5">Colsubsidio</text>
    <text x="3" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#64748B" letter-spacing="1">CON TODO LO QUE TE MERECES</text>
  </g>
</svg>
